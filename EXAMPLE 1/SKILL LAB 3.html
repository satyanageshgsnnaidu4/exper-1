<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <style>
        table, th, td {
            border: 1px solid yellowgreen;
            border-collapse: GREEN;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Student Details</h2>

<table>
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Department</th>
    </tr>
    <tr>
        <td>101</td>
        <td>GSN</td>
        <td>CSE</td>
    </tr>
    <tr>
        <td>102</td>
        <td>SANJAY</td>
        <td>ECE</td>
    </tr>
    <tr>
        <td>103</td>
        <td>SAI</td>
        <td>EEE</td>
    </tr>
</table>

</body>
</html>
